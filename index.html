<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="在瀏覽器裡完成的 GIF 小工具：Breach 雜訊動畫、讀取中 GIF。圖片不會上傳。">
<title>GIF 小工具箱</title>
<style>
@font-face{font-family:"Chakra Petch";font-weight:600;font-display:swap;src:url(fonts/chakra-petch-600.woff) format("woff")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-400.woff) format("woff")}
:root{
  --bg:#0f1217;--panel:#161a21;--line:#2c333f;--fg:#e3e8f0;--muted:#8b96a8;--accent:#ffb43d;
  --f-display:"Chakra Petch",system-ui,sans-serif;
  --f-body:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:48px}
main{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1{margin:0;font-family:var(--f-display);font-size:clamp(28px,5vw,40px);letter-spacing:.04em}
h1 b{color:var(--accent);font-weight:600}
.lede{margin:6px 0 0;color:var(--muted);max-width:60ch}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
a.tool{display:flex;flex-direction:column;gap:12px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
a.tool:hover{border-color:var(--accent);transform:translateY(-2px)}
a.tool:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.screen{height:120px;border-radius:6px;background:#07090c;position:relative;overflow:hidden;display:grid;place-items:center}
.tool h2{margin:0;font-size:18px}
.tool p{margin:0;color:var(--muted);font-size:14px}
.go{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
/* breach mini preview */
.glitch{width:70%;height:56px;position:relative}
.glitch i{position:absolute;left:0;right:0;height:8px;background:var(--accent);opacity:.8;animation:g 1.6s steps(1) infinite}
.glitch i:nth-child(1){top:4px;animation-delay:-.2s}
.glitch i:nth-child(2){top:20px;background:#5fe0ff;animation-delay:-.7s}
.glitch i:nth-child(3){top:36px;animation-delay:-1.1s}
.glitch span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:#ff6474;letter-spacing:.2em;animation:t 1.6s steps(1) infinite}
@keyframes g{0%{transform:translateX(-30%);width:40%}25%{transform:translateX(60%);width:30%}50%{transform:translateX(10%);width:80%}75%{opacity:0}}
@keyframes t{0%,70%{opacity:0}71%{opacity:1}}
/* loading mini preview */
.load{display:flex;flex-direction:column;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px;color:var(--fg)}
.bar{width:150px;height:14px;border:2px solid var(--fg);padding:2px}
.bar i{display:block;height:100%;background:var(--accent);animation:f 3s linear infinite}
@keyframes f{0%{width:0}85%,100%{width:100%}}
/* summon mini preview */
.summon{position:absolute;inset:0;background:#fff;overflow:hidden}
.summon .wedge{position:absolute;inset:0;background:#7d7d7d;clip-path:polygon(0 60%,100% 28%,100% 86%,0 72%);animation:sw 3s ease-out infinite}
.summon .sil{position:absolute;left:44%;bottom:-6px;width:46px;height:96px;animation:sl 3s ease-out infinite}
.summon .sil::before{content:"";position:absolute;left:8px;top:0;width:30px;height:30px;border-radius:50%;background:#141414}
.summon .sil::after{content:"";position:absolute;left:0;top:30px;width:46px;height:70px;border-radius:22px 22px 0 0;background:#141414}
.summon .nm{position:absolute;left:12%;top:38%;font-family:var(--f-display);font-size:18px;color:#141414;letter-spacing:.08em;opacity:0;animation:nm 3s infinite}
.summon .nm i{display:block;font-style:normal;color:var(--accent);font-size:10px;letter-spacing:.2em}
@keyframes sw{0%{clip-path:polygon(0 60%,0 60%,0 72%,0 72%)}14%,100%{clip-path:polygon(0 60%,100% 28%,100% 86%,0 72%)}}
@keyframes sl{0%{transform:translateX(70px);opacity:0}8%{opacity:1}40%{transform:translateX(0)}100%{transform:translateX(-6px)}}
@keyframes nm{0%,55%{opacity:0;transform:translateX(-10px)}68%,100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.glitch i,.glitch span,.bar i,.summon *{animation:none}.summon .nm{opacity:1}.bar i{width:60%}}
.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;margin:0}
</style>
</head>
<body>
<main>
  <header>
    <h1>GIF <b>TOOLS</b></h1>
    <p class="lede">幾個做 GIF 動畫的小工具。圖片都只在你的瀏覽器裡處理，不會上傳到任何伺服器。</p>
  </header>
  <div class="tools">
    <a class="tool" href="breach/index.html">
      <div class="screen" aria-hidden="true"><div class="glitch"><i></i><i></i><i></i><span>ACCESS DENIED</span></div></div>
      <h2>Breach 雜訊動畫產生器</h2>
      <p>框出區塊、輸入文字，產生雜訊亂碼後黑屏或換圖的 GIF。</p>
      <span class="go">開啟 →</span>
    </a>
    <a class="tool" href="loading/index.html">
      <div class="screen" aria-hidden="true"><div class="load"><div class="bar"><i></i></div>LOADING...</div></div>
      <h2>讀取中 GIF 製作器</h2>
      <p>上傳多張圖片排序，加上「讀取中...」、LOADING 或進度條，做成循環 GIF。</p>
      <span class="go">開啟 →</span>
    </a>
    <a class="tool" href="gacha/index.html">
      <div class="screen" aria-hidden="true"><div class="summon"><div class="sil"></div><div class="wedge"></div><div class="nm"><i>★★★★★</i>NAME</div></div></div>
      <h2>抽卡登場動畫產生器</h2>
      <p>上傳去背人物圖、輸入名字，產生色塊刷入、剪影閃過、角色登場的抽卡 GIF。</p>
      <span class="go">開啟 →</span>
    </a>
  </div>
  <p class="note">新增工具時，在這個網站裡加一個資料夾，再在這頁補一張卡片即可。</p>
</main>
</body>
</html>
